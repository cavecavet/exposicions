<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Prueba Logo</title>

<style>
body{
    font-family:Arial;
    padding:40px;
    background:#f3f6f8;
}

.card{
    width:320px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

img{
    width:200px;
    height:200px;
    object-fit:contain;
}

.boton{
    display:inline-block;
    margin-top:15px;
    padding:10px 15px;
    background:#0f6c8c;
    color:white;
    text-decoration:none;
    border-radius:8px;
}
</style>

</head>
<body>

<div class="card">

    <img
        src="Logo00.png"
        alt="Associació Cave Cavet"
        onerror="alert('No se encuentra Logo00.png');">

    <h3>Associació Cave Cavet</h3>

    <a
        class="boton"
        href="https://cavecavet.org"
        target="_blank">
        Visitar web
    </a>

</div>

</body>
</html>
